<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HyperRace — F-Zero Edition</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
  overflow: hidden;
  font-family: 'Courier New', monospace;
}
canvas { display: block; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ─────────────────────────────────────────────────────────────────────────────
// CANVAS SETUP
// ─────────────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 900, H = 600;
canvas.width = W; canvas.height = H;

// ─────────────────────────────────────────────────────────────────────────────
// TRACK GEOMETRY
// ─────────────────────────────────────────────────────────────────────────────
const CX = W / 2, CY = H / 2;
const OUT_RX = 415, OUT_RY = 255;
const IN_RX  = 235, IN_RY  = 125;
const MID_RX = (OUT_RX + IN_RX) / 2;
const MID_RY = (OUT_RY + IN_RY) / 2;

// Waypoints along the center of the track (counterclockwise, starting at top)
const NUM_WP = 36;
const WPS = [];
for (let i = 0; i < NUM_WP; i++) {
  const a = -Math.PI / 2 + (i / NUM_WP) * Math.PI * 2;
  WPS.push({ x: CX + MID_RX * Math.cos(a), y: CY + MID_RY * Math.sin(a), a });
}

// ─────────────────────────────────────────────────────────────────────────────
// COLOR UTILITIES
// ─────────────────────────────────────────────────────────────────────────────
function hexToRGB(hex) {
  const n = parseInt(hex.replace('#',''), 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function lighten(hex, amt) {
  const [r,g,b] = hexToRGB(hex);
  return `rgb(${Math.min(255,r+amt)},${Math.min(255,g+amt)},${Math.min(255,b+amt)})`;
}
function darken(hex, amt) {
  const [r,g,b] = hexToRGB(hex);
  return `rgb(${Math.max(0,r-amt)},${Math.max(0,g-amt)},${Math.max(0,b-amt)})`;
}

// ─────────────────────────────────────────────────────────────────────────────
// CAR COLOR SCHEMES  (F-Zero hypercar palette)
// ─────────────────────────────────────────────────────────────────────────────
const SCHEMES = [
  { body:'#1144ff', stripe:'#ffffff', cockpit:'#00ffff', name:'BLUE FALCON'   }, // 0 player
  { body:'#ff2200', stripe:'#ffff00', cockpit:'#ff8800', name:'FIRE HAWK'     },
  { body:'#ffcc00', stripe:'#ff2200', cockpit:'#ffffff', name:'GOLDEN FOX'    },
  { body:'#00bb33', stripe:'#00ffaa', cockpit:'#ffffff', name:'WILD GOOSE'    },
  { body:'#ff00cc', stripe:'#ffffff', cockpit:'#ffff00', name:'PINK HORNET'   },
  { body:'#ff6600', stripe:'#ffff00', cockpit:'#ffffff', name:'IRON TIGER'    },
  { body:'#00ccff', stripe:'#003388', cockpit:'#ffffff', name:'WHITE CAT'     },
  { body:'#ffffff', stripe:'#ff0000', cockpit:'#0000ff', name:'SILVER WOLF'   },
  { body:'#880088', stripe:'#ff88ff', cockpit:'#ffff00', name:'DARK WIDOW'    },
  { body:'#88ff00', stripe:'#004400', cockpit:'#00ffff', name:'GREEN COMET'   },
  { body:'#ff4488', stripe:'#ffffff', cockpit:'#ff0000', name:'ROSE VIPER'    },
  { body:'#00ffdd', stripe:'#004444', cockpit:'#ffffff', name:'CYAN BLADE'    },
  { body:'#ff8844', stripe:'#882200', cockpit:'#ffff88', name:'EMBER STORM'   },
];

// ─────────────────────────────────────────────────────────────────────────────
// PHYSICS CONSTANTS
// ─────────────────────────────────────────────────────────────────────────────
const PLAYER_ACCEL   = 0.28;
const REVERSE_ACCEL  = 0.10;
const FRICTION       = 0.924;
const PLAYER_MAX_SPD = 6.5;
const TURN_BASE      = 0.048;
const TOTAL_LAPS     = 3;

// ─────────────────────────────────────────────────────────────────────────────
// TRACK POSITION HELPER
// ─────────────────────────────────────────────────────────────────────────────
function trackPosAt(t) {
  const x = CX + MID_RX * Math.cos(t);
  const y = CY + MID_RY * Math.sin(t);
  // Tangent direction (counterclockwise)
  const tx = -MID_RX * Math.sin(t);
  const ty =  MID_RY * Math.cos(t);
  const angle = Math.atan2(ty, tx);
  // Outward normal
  const nxu = Math.cos(t) / MID_RX;
  const nyu = Math.sin(t) / MID_RY;
  const nl  = Math.hypot(nxu, nyu);
  return { x, y, angle, nx: nxu/nl, ny: nyu/nl };
}

// ─────────────────────────────────────────────────────────────────────────────
// CAR CLASS
// ─────────────────────────────────────────────────────────────────────────────
class Car {
  constructor(id, isPlayer) {
    this.id       = id;
    this.isPlayer = isPlayer;
    this.sc       = SCHEMES[id];

    // Starting grid: row 0 = front (player), stagger 2 per row
    const row  = Math.floor(id / 2);
    const col  = id % 2;              // 0 = left lane, 1 = right lane
    const rowDt = 50 / MID_RX;       // angular step per row (~50px apart)
    const startT = -Math.PI / 2 - (row + 1) * rowDt;
    const pos  = trackPosAt(startT);
    const laneSign = col === 0 ? -1 : 1;

    this.x     = pos.x + pos.nx * laneSign * 22;
    this.y     = pos.y + pos.ny * laneSign * 22;
    this.angle = pos.angle;
    this.speed = 0;

    // Lap tracking via waypoints
    this.nextWp        = 0;
    this.wpsPassed     = 0;         // total waypoints crossed this race
    this.lap           = 0;
    this.finished      = false;
    this.finishWps     = 0;

    // AI state
    this.aiMaxSpeed  = isPlayer ? PLAYER_MAX_SPD : PLAYER_MAX_SPD * (0.70 + id * 0.018);
    this.aiTargetWp  = 3;           // look ahead 3 waypoints

    // Small exhaust particles
    this.sparks = [];
  }

  // ── UPDATE ────────────────────────────────────────────────────────────────
  update(inp) {
    if (this.finished) {
      this.speed *= 0.97;
      this.x += Math.cos(this.angle) * this.speed;
      this.y += Math.sin(this.angle) * this.speed;
      this.updateSparks();
      return;
    }

    if (this.isPlayer) {
      this.updatePlayer(inp);
    } else {
      this.updateAI();
    }

    this.x += Math.cos(this.angle) * this.speed;
    this.y += Math.sin(this.angle) * this.speed;
    this.constrainToTrack();
    this.checkWaypoints();
    this.updateSparks();
  }

  updatePlayer(inp) {
    if (inp.gas) {
      this.speed = Math.min(this.speed + PLAYER_ACCEL, PLAYER_MAX_SPD);
    } else if (inp.rev) {
      this.speed = Math.max(this.speed - REVERSE_ACCEL, -PLAYER_MAX_SPD * 0.4);
    } else {
      this.speed *= FRICTION;
    }
    const spd01 = Math.abs(this.speed) / PLAYER_MAX_SPD;
    const tr = TURN_BASE * Math.max(0.15, spd01);
    if (inp.left)  this.angle -= tr;
    if (inp.right) this.angle += tr;
  }

  updateAI() {
    const wp  = WPS[this.aiTargetWp % NUM_WP];
    const dx  = wp.x - this.x;
    const dy  = wp.y - this.y;
    const d   = Math.hypot(dx, dy);

    if (d < 45) {
      this.aiTargetWp = (this.aiTargetWp + 1) % NUM_WP;
    }

    // Steer toward target
    const ta = Math.atan2(dy, dx);
    let diff = ta - this.angle;
    while (diff >  Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    const steer = Math.sign(diff) * Math.min(Math.abs(diff), TURN_BASE * 2.2);
    this.angle += steer;

    // Speed: brake for sharp bends
    const sharpness = Math.abs(diff) / Math.PI;
    const targetSpd = this.aiMaxSpeed * Math.max(0.35, 1 - sharpness * 0.6);
    if (this.speed < targetSpd) {
      this.speed += PLAYER_ACCEL * 0.65;
    }
    this.speed *= FRICTION;
  }

  constrainToTrack() {
    const dx = this.x - CX, dy = this.y - CY;
    // Outer wall
    if ((dx/OUT_RX)**2 + (dy/OUT_RY)**2 > 1) {
      const a = Math.atan2(dy / OUT_RY, dx / OUT_RX);
      this.x = CX + Math.cos(a) * OUT_RX * 0.97;
      this.y = CY + Math.sin(a) * OUT_RY * 0.97;
      this.speed *= 0.35;
    }
    // Inner wall
    if ((dx/IN_RX)**2 + (dy/IN_RY)**2 < 1) {
      const a = Math.atan2(dy / IN_RY, dx / IN_RX);
      this.x = CX + Math.cos(a) * IN_RX * 1.035;
      this.y = CY + Math.sin(a) * IN_RY * 1.035;
      this.speed *= 0.35;
    }
  }

  checkWaypoints() {
    const wp = WPS[this.nextWp];
    const d  = Math.hypot(wp.x - this.x, wp.y - this.y);
    if (d < 100) {
      // wpsPassed > 0 guards against a phantom lap: car id=0 spawns ~54px
      // from WP[0] (inside the 55px threshold), so the very first frame of
      // racing would fire this without the guard.  After that first free
      // crossing wpsPassed=1, so every subsequent WP[0] pass counts normally.
      if (this.nextWp === 0 && this.wpsPassed > 0) {
        this.lap++;
        if (this.lap >= TOTAL_LAPS) {
          this.finished  = true;
          this.finishWps = this.wpsPassed;
        }
      }
      this.wpsPassed++;
      this.nextWp = (this.nextWp + 1) % NUM_WP;
    }
  }

  // rank: more negative = better (for sorting ascending)
  get rank() { return -(this.lap * NUM_WP + this.wpsPassed); }

  // ── SPARKS ────────────────────────────────────────────────────────────────
  updateSparks() {
    if (Math.abs(this.speed) > 1.5 && Math.random() < 0.4) {
      const rearX = this.x - Math.cos(this.angle) * 18;
      const rearY = this.y - Math.sin(this.angle) * 18;
      this.sparks.push({
        x: rearX + (Math.random()-0.5)*4,
        y: rearY + (Math.random()-0.5)*4,
        vx: -Math.cos(this.angle)*1.5 + (Math.random()-0.5)*1.2,
        vy: -Math.sin(this.angle)*1.5 + (Math.random()-0.5)*1.2,
        life: 0.8 + Math.random()*0.4,
        maxLife: 0.8 + Math.random()*0.4,
      });
    }
    for (let i = this.sparks.length - 1; i >= 0; i--) {
      const s = this.sparks[i];
      s.x += s.vx; s.y += s.vy;
      s.vx *= 0.92; s.vy *= 0.92;
      s.life -= 0.05;
      if (s.life <= 0) this.sparks.splice(i, 1);
    }
  }

  drawSparks() {
    for (const s of this.sparks) {
      const t = s.life / s.maxLife;
      const r = Math.floor(255);
      const g = Math.floor(160 * t);
      ctx.fillStyle = `rgba(${r},${g},0,${t * 0.8})`;
      ctx.fillRect(s.x - 1, s.y - 1, 2, 2);
    }
  }

  // ── DRAW ─────────────────────────────────────────────────────────────────
  draw() {
    this.drawSparks();
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.angle + Math.PI / 2); // car faces "up" in local space
    this.drawBody();
    ctx.restore();
  }

  drawBody() {
    const { body, stripe, cockpit } = this.sc;
    const bw = 16, bh = 22; // half-widths

    // ── Shadow
    ctx.save();
    ctx.translate(3, 4);
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.beginPath();
    ctx.ellipse(0, 0, bw, bh * 0.7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // ── Side wings
    ctx.fillStyle = darken(body, 35);
    // Left wing
    ctx.beginPath();
    ctx.moveTo(-bw * 0.65, -bh * 0.05);
    ctx.lineTo(-bw * 1.35, bh * 0.22);
    ctx.lineTo(-bw * 1.10, bh * 0.55);
    ctx.lineTo(-bw * 0.55, bh * 0.30);
    ctx.closePath();
    ctx.fill();
    // Right wing (mirror)
    ctx.beginPath();
    ctx.moveTo( bw * 0.65, -bh * 0.05);
    ctx.lineTo( bw * 1.35,  bh * 0.22);
    ctx.lineTo( bw * 1.10,  bh * 0.55);
    ctx.lineTo( bw * 0.55,  bh * 0.30);
    ctx.closePath();
    ctx.fill();

    // ── Main body
    const bg = ctx.createLinearGradient(-bw, -bh, bw, bh);
    bg.addColorStop(0,   lighten(body, 90));
    bg.addColorStop(0.25, lighten(body, 35));
    bg.addColorStop(0.6,  body);
    bg.addColorStop(1,    darken(body, 55));
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(0, -bh);                                     // front tip
    ctx.bezierCurveTo( bw*0.45, -bh*0.75,  bw*0.9, -bh*0.35, bw*0.9, bh*0.1);
    ctx.bezierCurveTo( bw*0.9,   bh*0.55,  bw*0.5,  bh*0.9,  0,      bh);
    ctx.bezierCurveTo(-bw*0.5,   bh*0.9,  -bw*0.9,  bh*0.55,-bw*0.9, bh*0.1);
    ctx.bezierCurveTo(-bw*0.9,  -bh*0.35, -bw*0.45,-bh*0.75,  0,    -bh);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = darken(body, 70);
    ctx.lineWidth = 0.6;
    ctx.stroke();

    // ── Center stripe
    ctx.fillStyle = stripe;
    ctx.beginPath();
    ctx.moveTo(-3.5, -bh + 1);
    ctx.lineTo( 3.5, -bh + 1);
    ctx.lineTo( 4.5,  bh * 0.65);
    ctx.lineTo(-4.5,  bh * 0.65);
    ctx.closePath();
    ctx.fill();

    // ── Cockpit canopy
    const cg = ctx.createRadialGradient(0, -bh*0.18, 0, 0, -bh*0.18, 9);
    cg.addColorStop(0, '#ffffff');
    cg.addColorStop(0.4, lighten(cockpit, 50));
    cg.addColorStop(1,   cockpit);
    ctx.fillStyle = cg;
    ctx.beginPath();
    ctx.ellipse(0, -bh * 0.18, 5.5, 8.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = darken(cockpit, 40);
    ctx.lineWidth = 0.5;
    ctx.stroke();

    // ── Rear spoiler
    ctx.fillStyle = stripe;
    ctx.fillRect(-bw * 0.82, bh * 0.60, bw * 1.64, 3.5);
    ctx.strokeStyle = darken(stripe, 50);
    ctx.lineWidth = 0.5;
    ctx.strokeRect(-bw * 0.82, bh * 0.60, bw * 1.64, 3.5);

    // ── Engine exhaust glow
    const eg = ctx.createRadialGradient(0, bh * 0.78, 0, 0, bh * 0.78, 9);
    eg.addColorStop(0,   'rgba(255,180,0,0.9)');
    eg.addColorStop(0.5, 'rgba(255,80,0,0.5)');
    eg.addColorStop(1,   'rgba(255,0,0,0)');
    ctx.fillStyle = eg;
    ctx.beginPath();
    ctx.ellipse(0, bh * 0.78, 7, 10, 0, 0, Math.PI * 2);
    ctx.fill();

    // ── Front nose detail
    ctx.fillStyle = lighten(body, 50);
    ctx.beginPath();
    ctx.moveTo(0, -bh);
    ctx.lineTo( 4, -bh + 7);
    ctx.lineTo(-4, -bh + 7);
    ctx.closePath();
    ctx.fill();

    // ── Player marker
    if (this.isPlayer) {
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 9px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('▲', 0, bh + 14);
    }
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// INPUT
// ─────────────────────────────────────────────────────────────────────────────
const inp = { gas: false, rev: false, left: false, right: false };

document.addEventListener('keydown', e => {
  if (e.code === 'Space') { inp.gas = true; e.preventDefault(); }
  if (e.code === 'KeyW')  { inp.rev = true; e.preventDefault(); }
});
document.addEventListener('keyup', e => {
  if (e.code === 'Space') inp.gas = false;
  if (e.code === 'KeyW')  inp.rev = false;
});
// Left mouse button = turn left, Right mouse button = turn right
canvas.addEventListener('mousedown', e => {
  if (e.button === 0) inp.left  = true;
  if (e.button === 2) inp.right = true;
  e.preventDefault();
});
canvas.addEventListener('mouseup', e => {
  if (e.button === 0) inp.left  = false;
  if (e.button === 2) inp.right = false;
});
canvas.addEventListener('contextmenu', e => e.preventDefault());

// ─────────────────────────────────────────────────────────────────────────────
// INITIALISE CARS
// ─────────────────────────────────────────────────────────────────────────────
const cars = Array.from({ length: 13 }, (_, i) => new Car(i, i === 0));
// Set AI target waypoints staggered so they don't pile up
cars.forEach((car, i) => {
  if (!car.isPlayer) {
    car.aiTargetWp = (3 + Math.floor(i / 2)) % NUM_WP;
  }
});

// ─────────────────────────────────────────────────────────────────────────────
// DRAW TRACK
// ─────────────────────────────────────────────────────────────────────────────
function drawEllipseSegment(rx, ry, a1, a2, steps) {
  ctx.beginPath();
  for (let j = 0; j <= steps; j++) {
    const a = a1 + (a2 - a1) * (j / steps);
    const x = CX + rx * Math.cos(a);
    const y = CY + ry * Math.sin(a);
    j === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
}

function drawTrack() {
  // ── Space background already drawn in drawBG ──

  // Outer run-off / wall base
  ctx.fillStyle = '#1a1a2e';
  ctx.beginPath();
  ctx.ellipse(CX, CY, OUT_RX + 10, OUT_RY + 10, 0, 0, Math.PI * 2);
  ctx.fill();

  // Track surface
  ctx.fillStyle = '#28283c';
  ctx.beginPath();
  ctx.ellipse(CX, CY, OUT_RX, OUT_RY, 0, 0, Math.PI * 2);
  ctx.fill();

  // Track surface texture (subtle lighter patches)
  ctx.strokeStyle = '#2e2e42';
  ctx.lineWidth = 18;
  for (let i = 0; i < 12; i++) {
    const a1 = (i / 12) * Math.PI * 2;
    const a2 = a1 + Math.PI / 14;
    drawEllipseSegment((OUT_RX+IN_RX)/2, (OUT_RY+IN_RY)/2, a1, a2, 6);
    ctx.stroke();
  }

  // Rumble strip outer (alternating red/white)
  const NSTRIPES = 48;
  for (let i = 0; i < NSTRIPES; i++) {
    const a1 = (i / NSTRIPES) * Math.PI * 2;
    const a2 = ((i+1) / NSTRIPES) * Math.PI * 2;
    ctx.strokeStyle = i % 2 === 0 ? '#dd0000' : '#eeeeee';
    ctx.lineWidth = 8;
    drawEllipseSegment(OUT_RX - 4, OUT_RY - 4, a1, a2, 4);
    ctx.stroke();
  }

  // Rumble strip inner
  for (let i = 0; i < NSTRIPES; i++) {
    const a1 = (i / NSTRIPES) * Math.PI * 2;
    const a2 = ((i+1) / NSTRIPES) * Math.PI * 2;
    ctx.strokeStyle = i % 2 === 0 ? '#dd0000' : '#eeeeee';
    ctx.lineWidth = 8;
    drawEllipseSegment(IN_RX + 4, IN_RY + 4, a1, a2, 4);
    ctx.stroke();
  }

  // Infield
  ctx.fillStyle = '#111120';
  ctx.beginPath();
  ctx.ellipse(CX, CY, IN_RX, IN_RY, 0, 0, Math.PI * 2);
  ctx.fill();

  // Infield neon border inner
  ctx.strokeStyle = '#0055ff';
  ctx.lineWidth = 3;
  ctx.shadowColor = '#0055ff';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.ellipse(CX, CY, IN_RX, IN_RY, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Outer wall neon
  ctx.strokeStyle = '#ff3300';
  ctx.lineWidth = 3;
  ctx.shadowColor = '#ff3300';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.ellipse(CX, CY, OUT_RX, OUT_RY, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Dashed center line
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 2;
  ctx.setLineDash([22, 22]);
  ctx.beginPath();
  ctx.ellipse(CX, CY, MID_RX, MID_RY, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.setLineDash([]);

  // Start / Finish line
  const sfA = -Math.PI / 2;
  const sfX1 = CX + IN_RX  * Math.cos(sfA);
  const sfY1 = CY + IN_RY  * Math.sin(sfA);
  const sfX2 = CX + OUT_RX * Math.cos(sfA);
  const sfY2 = CY + OUT_RY * Math.sin(sfA);
  // Checkerboard finish line
  const steps = 7;
  for (let k = 0; k < steps; k++) {
    const t  = k / steps, t2 = (k+1) / steps;
    const x1 = sfX1 + (sfX2-sfX1)*t,  y1 = sfY1 + (sfY2-sfY1)*t;
    const x2 = sfX1 + (sfX2-sfX1)*t2, y2 = sfY1 + (sfY2-sfY1)*t2;
    ctx.fillStyle = k % 2 === 0 ? '#ffffff' : '#000000';
    ctx.fillRect(Math.min(x1,x2)-3, Math.min(y1,y2)-3, Math.abs(x2-x1)+6, Math.abs(y2-y1)+6);
  }

  // Infield logo
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffffff18';
  ctx.font = 'bold 22px Courier New';
  ctx.fillText('HYPERRACE', CX, CY - 8);
  ctx.font = '11px Courier New';
  ctx.fillStyle = '#ffffff10';
  ctx.fillText('F-ZERO EDITION', CX, CY + 14);
}

// ─────────────────────────────────────────────────────────────────────────────
// DRAW BACKGROUND (star field)
// ─────────────────────────────────────────────────────────────────────────────
const STARS = Array.from({ length: 80 }, (_, i) => ({
  x: (i * 137 + 17) % W,
  y: (i * 83  + 41) % H,
  r: Math.random() < 0.15 ? 2 : 1,
}));

function drawBG() {
  ctx.fillStyle = '#07070f';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#ffffff';
  for (const s of STARS) ctx.fillRect(s.x, s.y, s.r, s.r);
}

// ─────────────────────────────────────────────────────────────────────────────
// HUD
// ─────────────────────────────────────────────────────────────────────────────
function drawHUD() {
  const player  = cars[0];
  const sorted  = [...cars].sort((a, b) => a.rank - b.rank);
  const pos     = sorted.indexOf(player) + 1;
  const lapDisp = Math.min(player.lap + 1, TOTAL_LAPS);
  const spdKmh  = Math.abs(Math.round(player.speed * 55));

  // Panel background
  ctx.fillStyle   = 'rgba(0,0,20,0.82)';
  ctx.strokeStyle = '#00ffff';
  ctx.lineWidth   = 1.5;
  roundRect(10, 10, 210, 110, 6);
  ctx.fill();
  ctx.stroke();

  // Neon header
  ctx.fillStyle = '#00ffff';
  ctx.shadowColor = '#00ffff';
  ctx.shadowBlur  = 6;
  ctx.font = 'bold 13px Courier New';
  ctx.textAlign = 'left';
  ctx.fillText('HYPERRACE', 22, 32);
  ctx.shadowBlur  = 0;

  ctx.fillStyle = '#ffffff';
  ctx.font = '12px Courier New';
  ctx.fillText(`LAP  ${lapDisp} / ${TOTAL_LAPS}`, 22, 53);
  ctx.fillText(`POS  ${pos} / 13`,                22, 71);
  ctx.fillText(`SPD  ${spdKmh} km/h`,             22, 89);

  // Speed bar
  const barW = 180;
  const fill = (spdKmh / 360) * barW;
  ctx.fillStyle = '#111130';
  ctx.fillRect(22, 97, barW, 8);
  const sg = ctx.createLinearGradient(22, 0, 22 + fill, 0);
  sg.addColorStop(0, '#00ffff');
  sg.addColorStop(1, '#ff4400');
  ctx.fillStyle = sg;
  ctx.fillRect(22, 97, fill, 8);

  // Controls reminder
  ctx.fillStyle = 'rgba(0,0,15,0.75)';
  ctx.fillRect(0, H - 22, W, 22);
  ctx.fillStyle = '#888';
  ctx.font = '10px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('SPACE: Accelerate  |  W: Reverse  |  LEFT CLICK: Turn Left  |  RIGHT CLICK: Turn Right', W/2, H - 7);
}

// ─────────────────────────────────────────────────────────────────────────────
// POSITION PANEL (race order)
// ─────────────────────────────────────────────────────────────────────────────
function drawLeaderboard() {
  const sorted = [...cars].sort((a, b) => a.rank - b.rank);
  const px = W - 150, py = 10;

  ctx.fillStyle   = 'rgba(0,0,20,0.80)';
  ctx.strokeStyle = '#00ffff';
  ctx.lineWidth   = 1;
  roundRect(px, py, 140, 15 + sorted.length * 14, 6);
  ctx.fill();
  ctx.stroke();

  ctx.font = 'bold 10px Courier New';
  ctx.fillStyle = '#00ffff';
  ctx.textAlign = 'left';
  ctx.fillText('STANDINGS', px + 8, py + 13);

  for (let i = 0; i < sorted.length; i++) {
    const car = sorted[i];
    const y   = py + 26 + i * 14;
    ctx.fillStyle = car.isPlayer ? '#ffff00' : '#aaaaaa';
    ctx.fillText(`${i+1}. ${car.sc.name.substring(0,10)}`, px + 8, y);

    // Color swatch
    ctx.fillStyle = car.sc.body;
    ctx.fillRect(px + 126, y - 9, 8, 8);
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// FINISH SCREEN
// ─────────────────────────────────────────────────────────────────────────────
let gameState   = 'countdown';
let countdown   = 3;
let countTimer  = 0;
let finishRank  = 0;

function drawFinishScreen() {
  ctx.fillStyle = 'rgba(0,0,20,0.88)';
  roundRect(W/2 - 190, H/2 - 100, 380, 200, 10);
  ctx.fill();
  ctx.strokeStyle = '#00ffff';
  ctx.lineWidth = 2;
  roundRect(W/2 - 190, H/2 - 100, 380, 200, 10);
  ctx.stroke();

  ctx.textAlign = 'center';
  ctx.font = 'bold 28px Courier New';
  ctx.fillStyle = '#ffff00';
  ctx.shadowColor = '#ffff00';
  ctx.shadowBlur = 10;
  ctx.fillText('RACE COMPLETE!', W/2, H/2 - 55);
  ctx.shadowBlur = 0;

  ctx.font = '20px Courier New';
  ctx.fillStyle = '#00ffff';
  ctx.fillText(`FINAL POSITION: ${finishRank} / 13`, W/2, H/2 - 15);

  const medals = ['★ CHAMPION! ★', '★ EXCELLENT! ★', '★ GREAT RACE! ★'];
  const msg = finishRank <= 3
    ? medals[finishRank - 1]
    : finishRank <= 7 ? 'GOOD EFFORT!' : 'KEEP PRACTICING';
  ctx.font = '15px Courier New';
  ctx.fillStyle = finishRank === 1 ? '#ffff00' : '#ffffff';
  ctx.fillText(msg, W/2, H/2 + 20);

  ctx.font = '11px Courier New';
  ctx.fillStyle = '#666699';
  ctx.fillText('Refresh to race again', W/2, H/2 + 60);
}

function drawCountdown() {
  ctx.textAlign = 'center';
  ctx.font = 'bold 80px Courier New';
  const label = countdown > 0 ? `${countdown}` : 'GO!';
  const color = countdown > 0 ? '#ff4400' : '#00ff88';
  ctx.fillStyle = color;
  ctx.shadowColor = color;
  ctx.shadowBlur = 20;
  ctx.fillText(label, W / 2, H / 2 + 20);
  ctx.shadowBlur = 0;
}

// ─────────────────────────────────────────────────────────────────────────────
// ROUND RECT HELPER
// ─────────────────────────────────────────────────────────────────────────────
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y,     x + w, y + r,     r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x, y + h,     x, y + h - r,     r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y,         x + r, y,         r);
  ctx.closePath();
}

// ─────────────────────────────────────────────────────────────────────────────
// GAME LOOP
// ─────────────────────────────────────────────────────────────────────────────
let lastTime = 0;

function loop(ts) {
  const dt = ts - lastTime;
  lastTime = ts;

  // ── Countdown phase
  if (gameState === 'countdown') {
    countTimer += dt;
    if (countTimer >= 1000) {
      countTimer = 0;
      countdown--;
      if (countdown < 0) gameState = 'racing';
    }
  }

  // ── Draw
  drawBG();
  drawTrack();

  // Draw cars back-to-front (Y sort for depth)
  const ySort = [...cars].sort((a, b) => a.y - b.y);

  if (gameState === 'racing' || gameState === 'finished') {
    cars.forEach(car => car.update(inp));

    // Check player finish
    if (gameState === 'racing' && cars[0].finished) {
      const sorted = [...cars].sort((a, b) => a.rank - b.rank);
      finishRank = sorted.indexOf(cars[0]) + 1;
      gameState  = 'finished';
    }
  }

  ySort.forEach(car => car.draw());

  drawHUD();
  drawLeaderboard();

  if (gameState === 'countdown') drawCountdown();
  if (gameState === 'finished')  drawFinishScreen();

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
